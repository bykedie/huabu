services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3102"
      DB_PATH: /app/data/app.db
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      ADMIN_SETUP_TOKEN: "${ADMIN_SETUP_TOKEN:-}"
      WELCOME_POINTS: "${WELCOME_POINTS:-0}"
      SITE_BILLING_ENABLED: "${SITE_BILLING_ENABLED:-0}"
      MAX_CANVASES_PER_USER: "${MAX_CANVASES_PER_USER:-100}"
      MAX_ASSETS_PER_USER: "${MAX_ASSETS_PER_USER:-200}"
      MAX_CANVAS_BYTES: "${MAX_CANVAS_BYTES:-2097152}"
      MAX_USER_STORAGE_BYTES: "${MAX_USER_STORAGE_BYTES:-20971520}"
      REGISTRATION_RATE_LIMIT: "${REGISTRATION_RATE_LIMIT:-5}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_MODELS: "${AI_MODELS:-}"
      AI_IMAGE_BASE_URL: "${AI_IMAGE_BASE_URL:-}"
      AI_IMAGE_MODELS: "${AI_IMAGE_MODELS:-}"
      AI_TIMEOUT_MS: "${AI_TIMEOUT_MS:-120000}"
      AI_IMAGE_TIMEOUT_MS: "${AI_IMAGE_TIMEOUT_MS:-300000}"
      AI_PENDING_RECOVERY_MS: "${AI_PENDING_RECOVERY_MS:-180000}"
      AI_IMAGE_PENDING_RECOVERY_MS: "${AI_IMAGE_PENDING_RECOVERY_MS:-360000}"
      AI_MAX_RESPONSE_BYTES: "${AI_MAX_RESPONSE_BYTES:-2097152}"
      AI_IMAGE_MAX_RESPONSE_BYTES: "${AI_IMAGE_MAX_RESPONSE_BYTES:-52428800}"
      AI_VIDEO_BASE_URL: "${AI_VIDEO_BASE_URL:-}"
      AI_VIDEO_MEDIA_ORIGINS: "${AI_VIDEO_MEDIA_ORIGINS:-}"
      AI_VIDEO_MODELS: "${AI_VIDEO_MODELS:-}"
      AI_VIDEO_POINTS: "${AI_VIDEO_POINTS:-24}"
      AI_VIDEO_TIMEOUT_MS: "${AI_VIDEO_TIMEOUT_MS:-600000}"
      AI_VIDEO_POLL_MS: "${AI_VIDEO_POLL_MS:-2500}"
      AI_VIDEO_PENDING_RECOVERY_MS: "${AI_VIDEO_PENDING_RECOVERY_MS:-660000}"
      AI_VIDEO_MAX_RESPONSE_BYTES: "${AI_VIDEO_MAX_RESPONSE_BYTES:-67108864}"
      MAX_USER_MEDIA_BYTES: "${MAX_USER_MEDIA_BYTES:-536870912}"
      AI_INPUT_POINTS_PER_1K: "${AI_INPUT_POINTS_PER_1K:-1}"
      AI_OUTPUT_POINTS_PER_1K: "${AI_OUTPUT_POINTS_PER_1K:-4}"
      CENTS_PER_POINT: "${CENTS_PER_POINT:-1}"
      TOPUP_INSTRUCTIONS: "${TOPUP_INSTRUCTIONS:-}"
    ports:
      - "${PUBLIC_BIND:-0.0.0.0}:${PUBLIC_PORT:-3102}:3102"
    volumes:
      - canvas-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  canvas-data:
