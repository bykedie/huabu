services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      DB_PATH: /app/data/app.db
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - canvas-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  canvas-data:
